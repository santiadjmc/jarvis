name: jarvis
description: "Jarvis - a local-first AI assistant client for Android and desktop."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.0.2
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5
  speech_to_text: ^7.2.0
  record: ^7.1.1
  flutter_markdown: ^0.7.6+1
  uuid: ^4.5.1
  path: ^1.9.1
  whisper_ggml: ^2.7.1
  url_launcher: ^6.3.2
  device_info_plus: ^13.2.0
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.1
  battery_plus: ^7.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true