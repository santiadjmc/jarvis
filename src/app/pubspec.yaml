name: jarvis
description: "Jarvis - a local-first AI assistant client for Android and desktop."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.2
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5
  speech_to_text: ^7.2.0
  record: ^6.0.1
  permission_handler: ^12.0.0
  flutter_markdown: ^0.7.6+1
  uuid: ^4.5.1
  intl: ^0.20.2
  drift: ^2.30.0
  sqlite3_flutter_libs: ^0.5.42
  path: ^1.9.1
  whisper_ggml: ^1.0.0
  url_launcher: ^6.3.2
  device_info_plus: ^13.2.0
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.30.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true